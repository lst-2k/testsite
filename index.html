<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grip&Rip Rebirth74</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --primary: #6366f1;
            --secondary: #10b981; 
            --accent: #fbbf24; 
            --bg: #0f172a; 
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --red: #ef4444; 
            --green: #22c55e;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg); 
            background-image: radial-gradient(circle at top right, #1e1b4b, var(--bg));
            margin: 0; 
            padding: 0; 
            color: var(--text-main); 
            min-height: 100vh; 
        }

        .container { width: 100%; max-width: 1000px; margin: auto; }

        .logo-container { margin: 10px 10px 20px 10px; border-radius: 12px; overflow: hidden; }
        .logo-container img { width: 100%; height: auto; display: block; }

        .header-card { 
            background: var(--card-bg); 
            padding: 25px 15px; 
            margin: 0 10px 25px 10px;
            border-radius: 16px; 
            text-align: center; 
            border: 1px solid var(--border);
        }
        
        .header-card.is-major { 
            background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%); 
            border-bottom: 4px solid var(--accent);
        }

        .badge-area { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
        .event-badge { padding: 4px 12px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; display: none; }
        .is-major .major-tag { display: inline-block; background: var(--accent); color: #000; }
        .has-db .db-tag { display: inline-block; background: var(--secondary); color: #fff; }

        h2 { 
            font-size: 1rem; margin: 30px 15px 15px 15px; display: flex; align-items: center; 
            gap: 10px; text-transform: uppercase; color: var(--text-dim);
        }
        h3 { 
            background: rgba(255,255,255,0.05); padding: 12px 15px; margin: 0; 
            font-size: 0.9rem; color: var(--secondary); border-top: 1px solid var(--border);
        }

        .table-wrapper { 
            width: 100%; 
            overflow-x: auto; 
            background: var(--card-bg); 
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin-bottom: 0;
            -webkit-overflow-scrolling: touch;
        }

        table { 
            width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 480px; 
        }

        th { 
            background: rgba(15, 23, 42, 0.7); color: var(--text-dim); 
            padding: 12px 5px; font-size: 10px; text-transform: uppercase; 
            text-align: center; border-bottom: 1px solid var(--border);
        }

        td { 
            padding: 14px 5px; border-bottom: 1px solid var(--border); 
            text-align: center; font-size: 13px; font-weight: 500;
        }

        .col-pos { width: 40px; font-weight: 800; background: rgba(0,0,0,0.1); }
        .col-player { width: 130px; text-align: left !important; padding-left: 10px !important; }
        .col-data { width: 45px; }
        .col-pts { width: 60px; background: rgba(16, 185, 129, 0.1); color: var(--secondary); font-weight: 800; }

        .p-name-cell { display: flex; align-items: center; gap: 6px; white-space: nowrap; }

        .score-red { color: var(--red); font-weight: 800; }
        .score-green { color: var(--green); font-weight: 800; }

        .highlights-bar { 
            display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 15px; 
            background: rgba(0,0,0,0.3); margin-bottom: 30px; border-bottom: 1px solid var(--border);
        }
        .high-tag { 
            background: #0f172a; padding: 4px 8px; border-radius: 4px; 
            font-size: 10px; border: 1px solid var(--border); display: flex; align-items: center; gap: 5px;
        }
        .high-tag.gold { border-color: var(--accent); color: var(--accent); }

        .st-card { margin-bottom: 25px; width: 100%; }
        .st-card h4 { margin: 0; padding: 12px 15px; background: #334155; font-size: 11px; text-transform: uppercase; }

        .hist-acc { border-bottom: 1px solid var(--border); }
        .hist-header { background: var(--card-bg); padding: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .hist-content { display: none; padding: 0; background: #0f172a; }
        .hist-content.active { display: block; }

        #backToTop { 
            position: fixed; bottom: 20px; right: 20px; width: 40px; height: 40px; 
            background: var(--primary); color: white; border: none; border-radius: 8px; 
            cursor: pointer; display: none; z-index: 1000;
        }
		/* Promotion Indicator */
		.promo-badge {
			color: #22c55e;
			margin-left: 6px;
			font-size: 12px;
			animation: promoPulse 1.5s infinite ease-in-out;
		}

		@keyframes promoPulse {
			0% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(34, 197, 94, 0)); }
			50% { transform: scale(1.15); filter: drop-shadow(0 0 5px rgba(34, 197, 94, 0.9)); }
			100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(34, 197, 94, 0)); }
		}
		/* Relegation Indicator Badge */
			.relegate-badge {
				color: #ef4444;
				margin-left: 6px;
				font-size: 12px;
				animation: relegatePulse 1.5s infinite ease-in-out;
			}

			@keyframes relegatePulse {
				0% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(239, 68, 68, 0)); }
				50% { transform: scale(1.15); filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.9)); }
				100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(239, 68, 68, 0)); }
			}
			/* Dynamic Column Hiding */
			.hide-col {
				display: none !important;
			}
		/* Player Profile Modal */
		.modal-overlay {
			display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
			background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;
		}
		.modal-overlay.active { display: flex; }
		.modal-content {
			background: #1e293b; color: #fff; width: 90%; max-width: 600px; max-height: 85vh;
			border-radius: 12px; padding: 20px; overflow-y: auto; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
		}
		.modal-close {
			position: absolute; top: 15px; right: 15px; background: none; border: none;
			color: #94a3b8; font-size: 22px; cursor: pointer;
		}
		.modal-close:hover { color: #fff; }
		.profile-tabs { display: flex; gap: 8px; border-bottom: 1px solid #334155; margin: 15px 0; overflow-x: auto; }
		.tab-btn {
			background: none; border: none; color: #94a3b8; padding: 8px 16px; cursor: pointer;
			font-weight: bold; border-bottom: 2px solid transparent; white-space: nowrap;
		}
		.tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; }
		.tab-content { display: none; }
		.tab-content.active { display: block; }
		.clickable-player { cursor: pointer; color: #38bdf8; }
		.clickable-player:hover { text-decoration: underline; }
		
		/* Profile Summary Badges */
		.profile-stats-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 12px;
			margin-bottom: 15px;
		}
		.stat-card {
			background: #0f172a;
			padding: 12px;
			border-radius: 8px;
			border: 1px solid #334155;
		}
		.stat-label { font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: bold; margin-bottom: 6px; }
		.stat-value { font-size: 16px; font-weight: bold; color: #f8fafc; }

		/* Finishing Position Discs */
		.form-disc {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 24px;
			height: 24px;
			border-radius: 50%;
			font-size: 11px;
			font-weight: bold;
			color: #0f172a;
			margin-right: 4px;
		}
		.disc-gold { background: linear-gradient(135deg, #ffe066, #eab308); color: #422006; }
		.disc-silver { background: linear-gradient(135deg, #e2e8f0, #94a3b8); color: #0f172a; }
		.disc-bronze { background: linear-gradient(135deg, #fdba74, #c2410c); color: #431407; }
		.disc-neutral { background: #334155; color: #cbd5e1; }
    </style>
</head>
<body>

<button id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"><i class="fa-solid fa-arrow-up"></i></button>

<div class="container">
    <div class="logo-container"><img src="logo.png" alt="League Logo"></div>
    
    <div id="header" class="header-card">
        <div class="badge-area">
            <span class="event-badge major-tag">🏆 Major</span>
            <span class="event-badge db-tag">🔥 2X Points</span>
        </div>
        <h1 id="v-name" style="margin:0; font-size: 1.5rem;">Tournament</h1>
        <div style="margin-top:5px; font-size: 13px; color: var(--text-dim);">
            <span id="v-sw">Season -- Week --</span> • <span id="v-date">--</span>
        </div>
    </div>

    <h2><i class="fa-solid fa-trophy"></i> Leaderboards</h2>
    <div id="div-tables"></div>

    <h2><i class="fa-solid fa-ranking-star"></i> Season Standings</h2>
    <div id="standings-area"></div>

    <div class="logo-container"><img src="2k25logo.png" alt="2K25 Logo"></div>

    <h2><i class="fa-solid fa-clock-rotate-left"></i> History</h2>
    <div id="history-area"></div>
</div>

<script>
    window.onscroll = () => { document.getElementById("backToTop").style.display = (window.scrollY > 400) ? "block" : "none"; };
    
    function getIcon(v) { 
        let c = v==="PS"?"#3b82f6":v==="Xbox"?"#22c55e":"#94a3b8";
        let i = v==="PS"?"playstation":v==="Xbox"?"xbox":"steam";
        return `<i class="fa-brands fa-${i}" style="color:${c};"></i>`; 
    }
    
    function parseToPar(v) { if(!v||v==="") return 999; let c = v.toString().toUpperCase(); return (c==='E'||c==='0')?0:parseInt(v); }
    function getScoreClass(v) { let n = parseToPar(v); if(n===999) return ""; return n<0?"score-red":(n===0?"score-green":""); }

    async function loadData() {
        try {
            const res = await fetch('data.json'); 
            const d = await res.json();
			window.currentLeagueData = d;
			window.rawHistoryHtml = d.historyHtml || "";
            document.getElementById('v-name').innerText = d.venue;
            if(d.isSig) document.getElementById('header').classList.add('is-major');
            if(d.doubleBonus) document.getElementById('header').classList.add('has-db');
            document.getElementById('v-sw').innerText = `Season ${d.seasonNum} Week ${d.weekNum}`;
            document.getElementById('v-date').innerText = d.date;

            const maxDivs = parseInt(d.maxDivisions) || 3;
            let activeDivs = [];
            for (let i = 1; i <= maxDivs; i++) {
                activeDivs.push(i);
            }

            document.getElementById('div-tables').innerHTML = '';
            document.getElementById('standings-area').innerHTML = '';

		// 1. RENDER WEEKLY LEADERBOARD TABLES PER DIVISION
		activeDivs.forEach(dv => {
			const players = d.players.filter(p => p.division == dv).sort((a,b) => parseToPar(a.toPar)-parseToPar(b.toPar));
			
			if (players.length === 0) return;

			// Check if anyone in this division scored an Ace or Alby
			const hasAce = players.some(p => p.ace && p.ace.trim() !== "");
			const hasAlby = players.some(p => p.alby && p.alby.trim() !== "");

			let h = `<h3>Division ${dv}</h3><div class="table-wrapper"><table><thead><tr>
				<th class="col-pos">POS</th>
				<th class="col-player">Player</th>
				<th class="col-data">Par</th>
				<th class="col-data">Putt</th>
				<th class="col-data">Shot</th>
				<th class="col-data ${hasAce ? '' : 'hide-col'}">Ace</th>
				<th class="col-data ${hasAlby ? '' : 'hide-col'}">Alby</th>
				<th class="col-pts">PTS</th>
			</tr></thead><tbody>`;
			
			let maxP={v:0,n:''}, maxS={v:0,n:''}, aces=[], albys=[];

			players.forEach(p => {
				let s = parseToPar(p.toPar); 
				let fI = players.findIndex(x => parseToPar(x.toPar) === s);
				let pts = (p.toPar!=="" || p.putt!=="") ? calculate(p, fI, d.isSig, d.doubleBonus) : "--";

				// Green promotion indicator badge for weekly view (2+ Win Streak & Div > 1)
				const streak = d.season?.[p.name]?.winStreak || 0;
				const showPromo = (dv > 1 && streak >= 2);
				const promoTag = showPromo 
					? `<i class="fa-solid fa-circle-arrow-up promo-badge" title="🔥 ${streak}-Win Streak! Win this week for automatic promotion!"></i>` 
					: '';

				h += `<tr>
					<td class="col-pos">${s===999?"--":fI+1}</td>
					<td class="col-player"><div class="p-name-cell">${renderPlayerLink(p.name, p.console)}${promoTag}</div></td>
					<td class="${getScoreClass(p.toPar)}">${p.toPar||'--'}</td>
					<td>${p.putt||'--'}</td>
					<td>${p.shot||'--'}</td>
					<td class="${hasAce ? '' : 'hide-col'}">${p.ace||'--'}</td>
					<td class="${hasAlby ? '' : 'hide-col'}">${p.alby||'--'}</td>
					<td class="col-pts">${pts}</td>
				</tr>`;

				let pVal = parseInt(p.putt) || 0, sVal = parseInt(p.shot) || 0;
				if(pVal > maxP.v) maxP = {v:pVal, n:p.name};
				if(sVal > maxS.v) maxS = {v:sVal, n:p.name};
				if(p.ace && p.ace.trim() !== "") aces.push(p.name); 
				if(p.alby && p.alby.trim() !== "") albys.push(p.name);
			});
			h += `</tbody></table></div>`;

			let hBar = `<div class="highlights-bar">`;
			if(maxP.v > 0) hBar += `<div class="high-tag"><span>🎯</span> <strong>Putt:</strong> ${maxP.n} (${maxP.v}ft)</div>`;
			if(maxS.v > 0) hBar += `<div class="high-tag"><span>🏌🏻</span> <strong>Shot:</strong> ${maxS.n} (${maxS.v}yds)</div>`;
			aces.forEach(n => hBar += `<div class="high-tag gold"><span>⛳</span> <strong>ACE:</strong> ${n}</div>`);
			albys.forEach(n => hBar += `<div class="high-tag gold"><span>🦅</span> <strong>ALBY:</strong> ${n}</div>`);
			hBar += `</div>`;

			document.getElementById('div-tables').innerHTML += h + ((maxP.v > 0 || maxS.v > 0 || aces.length > 0 || albys.length > 0) ? hBar : '<div style="margin-bottom:10px;"></div>');
		});

            // 2. RENDER SEASON STANDINGS PER DIVISION
			const arch = d.season||{};
			activeDivs.forEach(dv => {
				let filteredPlayers = d.players.filter(p => p.division == dv);
				if (filteredPlayers.length === 0) return;

				// Check if lower division (dv + 1) has any player with a green promotion marker
				const lowerDivPlayers = d.players.filter(p => p.division == (dv + 1));
				const lowerDivHasPromo = lowerDivPlayers.some(p => (arch[p.name]?.winStreak || 0) >= 2);

				let h = `<div class="st-card"><h4>DIVISION ${dv}</h4><div class="table-wrapper"><table><thead><tr>
					<th class="col-pos">POS</th>
					<th class="col-player">Player</th>
					<th class="col-data">Event</th>
					<th class="col-data">Wins</th>
					<th class="col-data">ACC</th>
					<th class="col-pts">TOTAL</th>
				</tr></thead><tbody>`;

				let sp = filteredPlayers.map(p => ({
					name:p.name, 
					console:p.console, 
					total:arch[p.name]?.points||0, 
					ev:arch[p.name]?.eventsPlayed||0, 
					wins:arch[p.name]?.wins||0, 
					acc:arch[p.name]?.acc||'--',
					winStreak:arch[p.name]?.winStreak||0
				})).sort((a,b) => {
					if (b.total !== a.total) return b.total - a.total; 
					return parseToPar(a.acc) - parseToPar(b.acc);     
				});
				
				sp.forEach((p, i) => {
					// Promotion Badge (Div > 1 and 2+ Win Streak)
					const showPromo = (dv > 1 && p.winStreak >= 2);
					const promoTag = showPromo 
						? `<i class="fa-solid fa-circle-arrow-up promo-badge" title="🔥 ${p.winStreak}-Win Streak! Win this week for automatic promotion!"></i>` 
						: '';

					// Relegation Badge (Bottom player ONLY IF a player in Division dv + 1 has a green promo marker)
					const isBottomPlayer = (i === sp.length - 1);
					const showRelegate = (dv < maxDivs && isBottomPlayer && lowerDivHasPromo);
					const relegateTag = showRelegate 
						? `<i class="fa-solid fa-circle-arrow-down relegate-badge" title="⚠️ Relegation Risk! Lower division player eligible for promotion."></i>` 
						: '';

					h += `<tr>
						<td class="col-pos">${i+1}</td>
						<td class="col-player"><div class="p-name-cell">${getIcon(p.console)} ${p.name}${promoTag}${relegateTag}</div></td>
						<td>${p.ev}</td>
						<td>${p.wins}</td>
						<td class="${getScoreClass(p.acc)}">${p.acc}</td>
						<td class="col-pts">${p.total}</td>
					</tr>`;
				});
				document.getElementById('standings-area').innerHTML += h + "</tbody></table></div></div>";
			});

            // 3. RENDER HISTORY ARCHIVE
            if(d.historyHtml) {
                document.getElementById('history-area').innerHTML = '';
                const tempDiv = document.createElement('div'); 
                tempDiv.innerHTML = d.historyHtml;

                tempDiv.querySelectorAll('.history-item').forEach(item => {
                    const title = item.querySelector('strong').innerText.replace(/S(\d+)\sW(\d+):/g, "S$1 W$2 •");
                    let table = item.querySelector('table');
                    let newTable = `<thead><tr><th class="col-player">Player</th><th class="col-data">Total</th><th class="col-pts">Points</th></tr></thead><tbody>`;
                    
                    table.querySelectorAll('tr').forEach(tr => {
                        let cells = tr.querySelectorAll('td, th');
                        if(tr.innerText.includes("Division")) {
                            newTable += `<tr style="background:rgba(255,255,255,0.05);"><td colspan="3" style="text-align:left; font-size:10px; font-weight:bold; color:var(--secondary); padding-left:10px;">${tr.innerText.toUpperCase()}</td></tr>`;
                        } else if(cells.length === 3) {
                            let p = d.players.find(x => x.name === cells[0].innerText);
                            newTable += `<tr><td class="col-player"><div class="p-name-cell">${p ? getIcon(p.console) : ''} ${cells[0].innerText}</div></td><td class="${getScoreClass(cells[1].innerText)}">${cells[1].innerText}</td><td class="col-pts">${cells[2].innerText}</td></tr>`;
                        }
                    });
                    
                    document.getElementById('history-area').innerHTML += `<div class="hist-acc"><div class="hist-header" onclick="this.nextElementSibling.classList.toggle('active')"><span>${title}</span><i class="fa-solid fa-chevron-down"></i></div><div class="hist-content"><div class="table-wrapper" style="border-radius:0;"><table>${newTable}</tbody></table></div></div></div>`;
                });
            }
        } catch(e) { 
            console.log("Error loading league data:", e); 
        }
    }

    function calculate(p, idx, isM, isDB) {
        let base = 100 - (idx * 10);
        if (base < 10) base = 10;
        
        let bM = isDB ? 2 : 1; let bonus = 0;
        if(parseInt(p.putt) > 0) bonus += (25*bM); if(parseInt(p.shot) > 0) bonus += (25*bM);
        if(p.ace && p.ace.trim() !== "") bonus += (50*bM); if(p.alby && p.alby.trim() !== "") bonus += (50*bM);
        return isM ? (base + bonus) * 2 : (base + bonus);
    }
	
	// Wrap player names with clickable class and onclick function
	function renderPlayerLink(name, consoleIcon) {
		const icon = consoleIcon ? getIcon(consoleIcon) + ' ' : '';
		return `<span class="clickable-player" onclick="openPlayerModal('${name}')">${icon}${name}</span>`;
	}

function openPlayerModal(playerName) {
    const normalize = (str) => str ? str.toString().toLowerCase().replace(/[\s_]/g, '') : '';
    const targetNormalized = normalize(playerName);

    // Look up console icon from current dataset
    const playerObj = (window.currentLeagueData?.players || []).find(p => normalize(p.name) === targetNormalized);
    const consoleIcon = playerObj ? getIcon(playerObj.console) + ' ' : '';

    // Set header
    document.getElementById('modalPlayerName').innerHTML = `${consoleIcon}${playerName}`;
    
    const tabsContainer = document.getElementById('modalTabs');
    const contentsContainer = document.getElementById('modalTabContents');
    
    tabsContainer.innerHTML = '';
    contentsContainer.innerHTML = '';

    // Fetch raw HTML string OR grab from rendered DOM history archive
    const historyContainer = document.createElement('div');
    historyContainer.innerHTML = window.rawHistoryHtml || document.getElementById('history-content')?.innerHTML || '';

    const seasonData = {};
    let allFinishes = [];
    let bestScoreToPar = 999;
    let bestScoreStr = "--";

    // Process all history cards
    historyContainer.querySelectorAll('.history-item').forEach(item => {
        const headerText = item.querySelector('strong')?.innerText || item.innerText || '';
        
        // Extract Season (S), Week (W), Venue, and Date
        const sMatch = headerText.match(/S(\d+)/i);
        const wMatch = headerText.match(/W(\d+)/i);
        const venueMatch = headerText.match(/:\s*([^\(]+)/);
        const dateMatch = headerText.match(/\((.*?)\)/);

        if (!sMatch || !wMatch) return;

        const sNum = sMatch[1];
        const wNum = wMatch[1];
        const venue = venueMatch ? venueMatch[1].trim() : 'Unknown';
        const date = dateMatch ? dateMatch[1].trim() : '';

        let currentDiv = "Division 1";
        let divisionRows = [];

        item.querySelectorAll('tr').forEach(tr => {
            const text = tr.innerText.trim();
            if (text.toLowerCase().includes('division')) {
                currentDiv = text;
            } else {
                const tds = tr.querySelectorAll('td');
                if (tds.length === 3) {
                    divisionRows.push({
                        name: tds[0].innerText.trim(),
                        toPar: tds[1].innerText.trim(),
                        pts: tds[2].innerText.trim(),
                        div: currentDiv
                    });
                }
            }
        });

        // Match targeted player
        const playerIndex = divisionRows.findIndex(r => normalize(r.name) === targetNormalized);
        if (playerIndex !== -1) {
            const pRecord = divisionRows[playerIndex];
            const pos = playerIndex + 1;

            allFinishes.push(pos);

            const parNum = parseToPar(pRecord.toPar);
            if (parNum < bestScoreToPar) {
                bestScoreToPar = parNum;
                bestScoreStr = `${pRecord.toPar} (${pRecord.div} • S${sNum}W${wNum})`;
            }

            if (!seasonData[sNum]) seasonData[sNum] = [];
            seasonData[sNum].push({
                week: wNum,
                venue: venue,
                date: date,
                div: pRecord.div,
                pos: pos,
                toPar: pRecord.toPar,
                pts: pRecord.pts
            });
        }
    });

    // Generate Form Badges
    const recent5 = allFinishes.slice(-5).reverse();
    let formHtml = recent5.map(pos => {
        let cls = "disc-neutral";
        if (pos === 1) cls = "disc-gold";
        else if (pos === 2) cls = "disc-silver";
        else if (pos === 3) cls = "disc-bronze";
        return `<span class="form-disc ${cls}">${pos}</span>`;
    }).join("");

    if (!formHtml) formHtml = '<span style="color:#94a3b8; font-size:12px;">No finishes recorded</span>';

    // Top Summary Box
    const summaryHtml = `
        <div class="profile-stats-grid">
            <div class="stat-card">
                <div class="stat-label">Current Form (Recent)</div>
                <div class="stat-value" style="display:flex; align-items:center;">${formHtml}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Best Gross Score</div>
                <div class="stat-value" style="color:#10b981;">${bestScoreStr}</div>
            </div>
        </div>
    `;

    const seasons = Object.keys(seasonData).sort((a,b) => b - a);

    if (seasons.length === 0) {
        contentsContainer.innerHTML = summaryHtml + '<p style="color:#94a3b8; padding:10px 0;">No historical records found for this player.</p>';
    } else {
        let tabsHtml = summaryHtml + `<div class="profile-tabs">`;
        let contentsHtml = '';

        seasons.forEach((sNum, idx) => {
            const isActive = idx === 0 ? 'active' : '';
            tabsHtml += `<button class="tab-btn ${isActive}" onclick="switchModalTab('sTab-${sNum}', this)">Season ${sNum}</button>`;
            
            let tableHtml = `<div id="sTab-${sNum}" class="tab-content ${isActive}"><div class="table-wrapper"><table>
                <thead><tr>
                    <th>Wk</th>
                    <th>Pos</th>
                    <th>Date</th>
                    <th>Venue</th>
                    <th>Div</th>
                    <th>Par</th>
                    <th>Pts</th>
                </tr></thead><tbody>`;

            seasonData[sNum].forEach(row => {
                let cls = "disc-neutral";
                if (row.pos === 1) cls = "disc-gold";
                else if (row.pos === 2) cls = "disc-silver";
                else if (row.pos === 3) cls = "disc-bronze";

                tableHtml += `<tr>
                    <td>W${row.week}</td>
                    <td><span class="form-disc ${cls}">${row.pos}</span></td>
                    <td><small>${row.date}</small></td>
                    <td>${row.venue}</td>
                    <td><small>${row.div}</small></td>
                    <td class="${getScoreClass(row.toPar)}">${row.toPar}</td>
                    <td class="col-pts">${row.pts}</td>
                </tr>`;
            });

            tableHtml += `</tbody></table></div></div>`;
            contentsHtml += tableHtml;
        });

        tabsHtml += `</div>`;
        contentsContainer.innerHTML = tabsHtml + contentsHtml;
    }

    document.getElementById('playerModal').classList.add('active');
}

	function switchModalTab(tabId, btn) {
		document.querySelectorAll('.modal-content .tab-btn').forEach(b => b.classList.remove('active'));
		document.querySelectorAll('.modal-content .tab-content').forEach(c => c.classList.remove('active'));
		btn.classList.add('active');
		document.getElementById(tabId).classList.add('active');
	}

	function closePlayerModal(e) {
		document.getElementById('playerModal').classList.remove('active');
	}
    window.onload = loadData;
</script>
<div id="playerModal" class="modal-overlay" onclick="closePlayerModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closePlayerModal()">&times;</button>
        <h2 id="modalPlayerName" style="margin-top:0;">Player Profile</h2>
        <div id="modalTabs" class="profile-tabs"></div>
        <div id="modalTabContents"></div>
    </div>
</div>
</body>
</html>
